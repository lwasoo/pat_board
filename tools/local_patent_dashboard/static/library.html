<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专利阅读工作台</title><link rel="stylesheet" href="/reader.css"><link rel="stylesheet" href="/library.css"></head>
<body class="library-body">
<header class="reader-header"><div class="brand"><a href="/" aria-label="专利阅读首页">IP</a><span>专利阅读工作台<small>全文、PDF 与双屏阅读</small></span></div><div class="header-tools"><a class="button" href="/index.html">年费与台账</a><button id="libraryShutdown">退出</button></div></header>
<main class="library-main">
  <section class="library-heading"><div><h1>我的专利文献</h1><p class="muted">上传 PDF，或添加美国公开号获取全文。文献保存在本机。</p></div><div class="header-tools"><button id="addNumber">＋ 添加公开号</button><button class="primary" id="addPdf">↑ 上传 PDF</button><input id="libraryPdf" type="file" accept="application/pdf,.pdf" hidden></div></section>
  <label class="library-search">查找文献<input id="librarySearch" type="search" placeholder="搜索标题、公开号或文件名"></label>
  <p id="libraryStatus" role="status" aria-live="polite"></p>
  <section id="libraryItems" class="library-grid" aria-label="专利文献列表"></section>
</main>
<dialog id="addDialog"><form id="addForm"><div class="dialog-title"><h2>添加专利文献</h2><button type="button" id="closeAdd">×</button></div><label>公开号<input id="newNumber" required placeholder="US10211630 或 US20250337340A1"></label><label>标题（可选）<input id="newTitle" maxlength="500"></label><p class="muted">可省略 A1/B1 等类型码，有多个匹配版本时会提示选择。获取美国全文需联网。其他文献可直接上传 PDF。</p><p id="addError" class="error" role="alert"></p><footer><button class="primary" id="createItem">添加并打开</button></footer></form></dialog>
<script src="/library.js"></script></body></html>
