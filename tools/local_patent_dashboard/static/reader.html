<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专利阅读工作台</title><link rel="stylesheet" href="/reader.css"></head>
<body>
<header class="reader-header"><div class="brand"><a href="/" aria-label="返回文献库">IP</a><span>专利阅读工作台<small>全文与本机文件 · 对照阅读</small></span></div><div class="header-tools"><button id="singleToggle">单栏阅读</button><button id="popout">↗ 第二屏窗口</button><a class="button" href="/">返回文献库</a></div></header>
<section class="patent-heading"><div><p id="patentNumber">正在加载专利…</p><h1 id="patentTitle">专利详情</h1><div id="patentTags" class="tags"></div></div><div class="file-tools"><input hidden id="pdfFile" type="file" accept=".pdf,application/pdf"><button class="primary" id="upload">↑ 上传专利 PDF</button><button id="retry" hidden>重新识别</button><button id="review" hidden>校对识别文字</button><a id="download" class="button" hidden download>下载原 PDF</a></div></section>
<div id="documentStatus" role="status" aria-live="polite" class="document-status">正在读取文件状态…</div>
<section class="online-toolbar" aria-label="电子全文"><label for="onlineNumber">美国公开号</label><input id="onlineNumber" placeholder="US10211630 或 20250337340" maxlength="100"><button id="fetchText">获取美国全文</button><button id="fetchPdf" disabled>获取原文 PDF / 附图</button><button id="usePdf" class="active">PDF 提取</button><button id="useOnline" disabled>电子全文</button><span id="onlineStatus" role="status" aria-live="polite">尚未获取电子全文</span></section>
<div id="versionChoices" class="online-toolbar" role="group" aria-label="选择文献版本" hidden></div>
<div id="pdfDownloadStatus" class="document-status" role="status" aria-live="polite" hidden></div>
<div id="workspace" class="workspace"><section class="reader-pane" id="leftPane" aria-label="左侧阅读栏"></section><div id="divider" class="divider" role="separator" aria-orientation="vertical" tabindex="0" aria-label="调整左右栏宽度"></div><section class="reader-pane" id="rightPane" aria-label="右侧阅读栏"></section></div>
<dialog id="reviewDialog"><form id="reviewForm"><div class="dialog-title"><h2>校对识别结果</h2><button type="button" data-close="reviewDialog">×</button></div><p class="muted">请对照原 PDF 修改。此处保存阅读内容，不会改写台账字段。权利要求每条以“1. ”等编号开头。</p><div id="metadataFields" class="form-grid"></div><label>权利要求<textarea id="claimsText" rows="10"></textarea></label><label>说明书<textarea id="descriptionText" rows="10"></textarea></label><p id="reviewError" class="error"></p><footer><button type="button" data-close="reviewDialog">取消</button><button class="primary">保存校对</button></footer></form></dialog>
<div id="toast" role="status"></div><script src="/reader.js"></script>
</body></html>
